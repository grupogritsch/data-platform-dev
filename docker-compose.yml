services:
  postgres:
    image: postgres:18.1
    container_name: postgres
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/scripts:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: pgadmin
    restart: no
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: "1"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
      PGADMIN_CONFIG_FILE_LOG_LEVEL: "30"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.11.3
    container_name: n8n
    restart: no
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_RUNNERS_DISABLED=true
      - N8N_BLOCK_COMMAND_EXECUTION=false
      - N8N_EXECUTIONS_PROCESS=main
      - N8N_SECURE_COOKIE=false
      # NAO USADO PELOS WORKFLOWS 3S ATUALMENTE — mantido so como referencia.
      # Tentativa 1: ler a credencial 3S via $env em Code nodes. Falhou em
      # producao ("access to env vars denied") porque o admin do n8n de
      # producao nao tem como liberar N8N_BLOCK_ENV_ACCESS_IN_NODE (sem
      # acesso a este docker-compose la).
      # Tentativa 2: credencial nativa do n8n (HTTP Basic Auth) lida via
      # $credentials dentro do node HTTP Request. Tambem falhou em producao
      # (HTTP 400 vazio da propria 3S assim que a credencial foi anexada —
      # suspeita: header Authorization que esse tipo de credencial sempre
      # adiciona e que nunca tinha sido testado contra este endpoint).
      # Solucao adotada: usuario/senha como literais dentro do Code "Monta
      # XML SOAP" de cada workflow (colados na mao apos importar, nao
      # versionados no git) — ver Workflows - n8n/3S - 10 a 13 e o runbook
      # em Gestao-rastreadores/docs/runbook-deploy-producao.md, Fase 2.
      # - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # - TRES_S_USUARIO=${TRES_S_USUARIO}
      # - TRES_S_SENHA=${TRES_S_SENHA}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/data:/data
    ports:
      - "5678:5678"
    networks:
      - data-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  n8n_data:
    driver: local

networks:
  data-network:
    driver: bridge
